services:
  - type: web
    name: discord-tampermonkey-bot
    runtime: node
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false      # you'll paste this in the Render dashboard
      - key: CLIENT_ID
        sync: false
      - key: WS_SECRET
        sync: false
